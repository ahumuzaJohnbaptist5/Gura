{% extends 'core/base.html' %}

{% block content %}
<div class="bg-gray-50 min-h-screen py-12 px-4 sm:px-6 lg:px-8 flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 text-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-check text-green-600 text-4xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-4">Message Sent!</h1>
        <p class="text-gray-600 mb-8">Thank you, {{ name|default:'there' }}! We've received your message and will get back to you within 24 hours.</p>
        <div class="space-x-4">
            <a href="{% url 'home' %}" class="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition">
                Go Home
            </a>
            <a href="{% url 'contact' %}" class="inline-block bg-gray-200 text-gray-800 px-6 py-3 rounded-lg font-bold hover:bg-gray-300 transition">
                Send Another
            </a>
        </div>
    </div>
</div>
{% endblock %}
