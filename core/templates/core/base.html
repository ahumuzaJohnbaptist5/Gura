<nav class="bg-white/90 backdrop-blur-md shadow-sm fixed w-full z-50 top-0 border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            
            <!-- Logo -->
            <a href="{% url 'home' %}" class="flex items-center space-x-2 group">
                <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-md group-hover:bg-blue-700 transition">
                    G
                </div>
                <span class="text-2xl font-extrabold text-gray-900 tracking-tight">GURA</span>
            </a>

            <!-- Centered Navigation Links -->
            <div class="hidden md:flex items-center space-x-6">
                <a href="{% url 'home' %}" class="text-gray-600 hover:text-blue-600 font-medium transition duration-200">Home</a>
                <a href="{% url 'services' %}" class="text-gray-600 hover:text-blue-600 font-medium transition duration-200">Services</a>
                <a href="{% url 'how_it_works' %}" class="text-gray-600 hover:text-blue-600 font-medium transition duration-200">How It Works</a>
                <a href="{% url 'providers' %}" class="text-gray-600 hover:text-blue-600 font-medium transition duration-200">Providers</a>
                <a href="{% url 'about' %}" class="text-gray-600 hover:text-blue-600 font-medium transition duration-200">About</a>
                <a href="{% url 'contact' %}" class="text-gray-600 hover:text-blue-600 font-medium transition duration-200">Contact</a>
            </div>

            <!-- Auth Buttons -->
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <span class="text-gray-700 font-medium hidden sm:block">Hi, {{ user.username }}</span>
                    <a href="{% url 'logout' %}" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg hover:bg-red-100 transition font-semibold text-sm border border-red-100">

                    <a href="{% url 'login' %}" class="text-gray-700 hover:text-blue-600 font-semibold transition duration-200 hidden sm:block">

                    </a>
                    <a href="{% url 'register' %}" class="bg-orange-500 text-white px-5 py-2.5 rounded-lg hover:bg-orange-600 transition font-bold shadow-md shadow-orange-500/20 transform hover:-translate-y-0.5 duration-200">
                        Get Started
                    </a>

        </div>
